name: Build and Release

on:
  push:
    branches:
      - 'test*' # 触发条件：每次推送以 v 开头的 tag（如 v0.2.2）触发

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # 授权写入 Release 的权限

    steps:
      - name: 📥 检出源码
        uses: actions/checkout@v4

      - name: ✟ 初始化 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 安装项目依赖
        run: npm install

      - name: 🧱 执行多模式打包 (Wallet & Market)
        run: |
          echo "开始打包 Wallet 模式..."
          npm run build:wallet
          
          echo "开始打包 Market 模式..."
          npm run build:market

      - name: 🚀 创建 GitHub Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-wallet/**/*
            dist-market/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
