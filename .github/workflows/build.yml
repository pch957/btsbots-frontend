name: BTSBots Multi-Platform CI/CD Build

on:
  push:
    tags:
      - 'v*.*.*'  # 触发条件：当推送形如 v1.0.0 的 git tag 时自动触发
  workflow_dispatch: # 支持在 GitHub 后台手动点击按钮触发

jobs:
  build-desktop-linux:
    name: Build Linux Desktop (Tauri)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install System Dependencies (Linux Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Wallet & Market Linux Deb
        run: |
          # 1. Wallet 版
          npm run build:wallet
          npm exec tauri build
          mkdir -p release-artifacts
          mv src-tauri/target/release/bundle/deb/*.deb release-artifacts/btsbots-wallet_amd64.deb

          # 2. Market 版
          npm run build:market
          npm exec tauri build -- --config src-tauri/tauri.market.conf.json
          mv src-tauri/target/release/bundle/deb/*.deb release-artifacts/btsbots-market_amd64.deb

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-packages
          path: release-artifacts/*.deb

  build-desktop-windows:
    name: Build Windows Desktop (Tauri)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Wallet & Market Windows Installers
        run: |
          # 1. Wallet 版
          npm run build:wallet
          npx tauri build
          mkdir release-artifacts
          # Tauri 在 Windows 默认产出 msi / exe，将其复制重命名以便识别
          move src-tauri\target\release\bundle\msi\*.msi release-artifacts\btsbots-wallet-setup.msi

          # 2. Market 版
          npm run build:market
          npx tauri build -- --config src-tauri/tauri.market.conf.json
          move src-tauri\target\release\bundle\msi\*.msi release-artifacts\btsbots-market-setup.msi

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-packages
          path: release-artifacts/*.msi

  build-android-apks:
    name: Build Android APKs (Capacitor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Wallet Android APK
        run: |
          npm run build:wallet
          ln -sf capacitor.wallet.config.ts capacitor.config.ts
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew clean assembleWalletRelease
          cd ..
          mkdir -p release-artifacts
          mv android/app/build/outputs/apk/wallet/release/app-wallet-release.apk release-artifacts/btsbots-wallet.apk

      - name: Build Market Android APK
        run: |
          npm run build:market
          ln -sf capacitor.market.config.ts capacitor.config.ts
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew clean assembleMarketRelease
          cd ..
          mv android/app/build/outputs/apk/market/release/app-market-release.apk release-artifacts/btsbots-market.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-packages
          path: release-artifacts/*.apk

  create-github-release:
    name: Publish Release to GitHub
    needs: [build-desktop-linux, build-desktop-windows, build-android-apks]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-across-directories: true

      - name: Display structure of downloaded files
        run: ls -R all-artifacts

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            all-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}