name: BTSBots Multi-Platform CI/CD Build

on:
  push:
    tags:
      - 'v*.*.*'  
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build-desktop-linux:
    name: Build Linux Desktop (Tauri)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install System Dependencies (Linux Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Wallet & Market Linux (Deb & AppImage)
        run: |
          mkdir -p release-artifacts

          echo "=== 正在构建 Wallet Linux ==="
          npm run build:wallet
          npm exec tauri build
          find src-tauri/target/release/bundle/deb/ -name "*.deb" -exec cp {} release-artifacts/btsbots-wallet_amd64.deb \;
          find src-tauri/target/release/bundle/appimage/ -name "*.AppImage" -exec cp {} release-artifacts/btsbots-wallet_amd64.AppImage \;

          rm -rf src-tauri/target/release/bundle/

          echo "=== 正在构建 Market Linux ==="
          npm run build:market
          npm exec tauri build -- --config src-tauri/tauri.market.conf.json
          find src-tauri/target/release/bundle/deb/ -name "*.deb" -exec cp {} release-artifacts/btsbots-market_amd64.deb \;
          find src-tauri/target/release/bundle/appimage/ -name "*.AppImage" -exec cp {} release-artifacts/btsbots-market_amd64.AppImage \;

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-desktop-linux
          path: release-artifacts/*

  build-desktop-windows:
    name: Build Windows Desktop (Tauri)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Wallet & Market Windows Installers
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts

          Copy-Item -Path "src-tauri\tauri.conf.json" -Destination "src-tauri\tauri.conf.json.bak" -Force

          echo "=== 正在构建 Wallet Windows 安装包 ==="
          npm run build:wallet
          npx tauri build
          Get-ChildItem -Path "src-tauri\target\release\bundle\msi\*.msi" | Copy-Item -Destination "release-artifacts\btsbots-wallet-setup.msi" -Force

          Remove-Item -Recurse -Force "src-tauri\target\release\bundle" -ErrorAction SilentlyContinue

          echo "=== 正在构建 Market Windows 安装包 ==="
          npm run build:market
          Copy-Item -Path "src-tauri\tauri.market.conf.json" -Destination "src-tauri\tauri.conf.json" -Force

          npx tauri build
          
          $marketMsi = Get-ChildItem -Path "src-tauri\target\release\bundle\msi\*.msi"
          if ($marketMsi) {
              $marketMsi | Copy-Item -Destination "release-artifacts\btsbots-market-setup.msi" -Force
          } else {
              Write-Error "Market MSI not found!"
              exit 1
          }

          Move-Item -Path "src-tauri\tauri.conf.json.bak" -Destination "src-tauri\tauri.conf.json" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-desktop-windows
          path: release-artifacts/*.msi
          if-no-files-found: error

  build-android-apks:
    name: Build Android APKs (Capacitor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 
          cache: 'npm'

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: npm install

      - name: Fix Android Java Version & Build APKs
        run: |
          echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties
          
          mkdir -p release-artifacts

          echo "=== 正在构建 Wallet Android APK ==="
          npm run build:wallet
          ln -sf capacitor.wallet.config.ts capacitor.config.ts
          npx cap sync android
          
          cd android
          chmod +x gradlew
          ./gradlew clean assembleWalletRelease
          cd ..
          find android/app/build/outputs/apk/wallet/release/ -name "*.apk" -exec cp {} release-artifacts/btsbots-wallet.apk \;

          echo "=== 正在构建 Market Android APK ==="
          npm run build:market
          ln -sf capacitor.market.config.ts capacitor.config.ts
          npx cap sync android
          
          cd android
          chmod +x gradlew
          ./gradlew clean assembleMarketRelease
          cd ..
          find android/app/build/outputs/apk/market/release/ -name "*.apk" -exec cp {} release-artifacts/btsbots-market.apk \;

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-android-apks
          path: release-artifacts/*.apk

  create-github-release:
    name: Publish Release to GitHub
    needs: [build-desktop-linux, build-desktop-windows, build-android-apks]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: final-release-files
          merge-across-directories: true # 👈 关键大招：自动把所有子目录下的文件聚合成平铺单层目录

      - name: Display structure of downloaded files
        run: ls -la final-release-files

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            final-release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}