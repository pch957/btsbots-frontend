name: BTSBots Multi-Platform CI/CD Build

on:
  push:
    tags:
      - 'v*.*.*'  
  workflow_dispatch: 

jobs:
  build-desktop-linux:
    name: Build Linux Desktop (Tauri)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install System Dependencies (Linux Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Wallet & Market Linux Deb
        run: |
          echo "=== 正在构建 Wallet Linux Deb ==="
          npm run build:wallet
          npm exec tauri build
          
          mkdir -p release-artifacts
          find src-tauri/target/release/bundle/deb/ -name "*.deb" -exec cp {} release-artifacts/btsbots-wallet_amd64.deb \;

          echo "=== 正在构建 Market Linux Deb ==="
          npm run build:market
          npm exec tauri build -- --config src-tauri/tauri.market.conf.json
          
          find src-tauri/target/release/bundle/deb/ -name "*.deb" -exec cp {} release-artifacts/btsbots-market_amd64.deb \;

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-packages
          path: release-artifacts/*.deb

  build-desktop-windows:
    name: Build Windows Desktop (Tauri)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Wallet & Market Windows Installers
        run: |
          echo "=== 正在构建 Wallet Windows 安装包 ==="
          npm run build:wallet
          npx tauri build
          
          mkdir release-artifacts
          Get-ChildItem -Path "src-tauri\target\release\bundle\msi\*.msi" | Copy-Item -Destination "release-artifacts\btsbots-wallet-setup.msi"

          echo "=== 正在构建 Market Windows 安装包 ==="
          npm run build:market
          
          # 💡 Windows 下为了彻底避免 CLI 参数解析错误，我们临时把市场配置文件覆盖为主配置
          Copy-Item -Path "src-tauri\tauri.market.conf.json" -Destination "src-tauri\tauri.conf.json" -Force
          npx tauri build
          
          Get-ChildItem -Path "src-tauri\target\release\bundle\msi\*.msi" | Copy-Item -Destination "release-artifacts\btsbots-market-setup.msi"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-packages
          path: release-artifacts/*.msi

  build-android-apks:
    name: Build Android APKs (Capacitor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # 🔴 强制升级到 Node.js 22，满足 Capacitor CLI >=22 要求
          cache: 'npm'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Wallet Android APK
        run: |
          echo "=== 正在构建 Wallet Android APK ==="
          npm run build:wallet
          ln -sf capacitor.wallet.config.ts capacitor.config.ts
          npx cap sync android
          
          cd android
          chmod +x gradlew
          ./gradlew clean assembleWalletRelease
          cd ..
          
          mkdir -p release-artifacts
          find android/app/build/outputs/apk/wallet/release/ -name "*.apk" -exec cp {} release-artifacts/btsbots-wallet.apk \;

      - name: Build Market Android APK
        run: |
          echo "=== 正在构建 Market Android APK ==="
          npm run build:market
          ln -sf capacitor.market.config.ts capacitor.config.ts
          npx cap sync android
          
          cd android
          chmod +x gradlew
          ./gradlew clean assembleMarketRelease
          cd ..
          
          find android/app/build/outputs/apk/market/release/ -name "*.apk" -exec cp {} release-artifacts/btsbots-market.apk \;

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-packages
          path: release-artifacts/*.apk

  create-github-release:
    name: Publish Release to GitHub
    needs: [build-desktop-linux, build-desktop-windows, build-android-apks]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-across-directories: true

      - name: Display structure of downloaded files
        run: ls -R all-artifacts

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            all-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}